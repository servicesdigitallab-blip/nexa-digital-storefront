  <body>
    <div id="root"></div>

    <!-- 100% Exact Real Tracking — No Guesses, No Inflation -->
    <script>
      (function() {
        var sId = sessionStorage.getItem('nexa_sess_id');
        if (!sId) {
          sId = 'sess_' + Math.random().toString(36).substring(2, 10) + Date.now();
          sessionStorage.setItem('nexa_sess_id', sId);
        }
        var isMobile = window.innerWidth <= 768 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        var dev = isMobile ? 'mobile' : 'desktop';
        var hdr = { 'Content-Type': 'application/json' };

        var visitKey = 'nexa_visited_' + window.location.pathname;
        if (!sessionStorage.getItem(visitKey)) {
          sessionStorage.setItem(visitKey, '1');
          fetch('/api/track/visit', {
            method: 'POST', headers: hdr,
            body: JSON.stringify({ sessionId: sId, device: dev, path: window.location.pathname })
          }).catch(function(){});
        }

        setInterval(function() {
          fetch('/api/track/heartbeat', {
            method: 'POST', headers: hdr,
            body: JSON.stringify({ sessionId: sId })
          }).catch(function(){});
        }, 25000);

        var path = window.location.pathname;
        if (path.startsWith('/product/')) {
          var toolSlug = path.replace('/product/', '').split('/')[0].split('?')[0];
          var viewKey = 'nexa_viewed_' + toolSlug;
          if (toolSlug && !sessionStorage.getItem(viewKey)) {
            sessionStorage.setItem(viewKey, '1');
            fetch('/api/track/view', {
              method: 'POST', headers: hdr,
              body: JSON.stringify({ toolId: toolSlug })
            }).catch(function(){});
          }
        }

        document.addEventListener('click', function(e) {
          var target = e.target ? e.target.closest('a, button') : null;
          if (!target) return;
          var href = target.getAttribute('href') || '';
          var text = (target.innerText || '').toLowerCase();

          var isWaClick = href.includes('wa.me') || href.includes('whatsapp.com') || 
                          (text.includes('order') && text.includes('whatsapp'));
          if (!isWaClick) return;

          var heading = document.querySelector('h1');
          var toolName = heading ? heading.innerText.trim() : '';
          var planEl = document.querySelector('[data-selected-plan]') || 
                       document.querySelector('.ring-2.ring-primary');
          var planName = planEl ? planEl.innerText.split('
')[0].trim() : 'Standard';

          var toolId = '';
          if (window.location.pathname.startsWith('/product/')) {
            toolId = window.location.pathname.replace('/product/', '').split('/')[0].split('?')[0];
          }

          fetch('/api/track/click', {
            method: 'POST', headers: hdr,
            body: JSON.stringify({
              toolId: toolId,
              toolName: toolName || 'Unknown',
              planName: planName,
              device: dev
            })
          }).catch(function(){});
        }, true);

        var lastPath = window.location.pathname;
        var observer = new MutationObserver(function() {
          if (window.location.pathname !== lastPath) {
            lastPath = window.location.pathname;
            var navKey = 'nexa_visited_' + lastPath;
            if (!sessionStorage.getItem(navKey)) {
              sessionStorage.setItem(navKey, '1');
              fetch('/api/track/visit', {
                method: 'POST', headers: hdr,
                body: JSON.stringify({ sessionId: sId, device: dev, path: lastPath })
              }).catch(function(){});
            }
            if (lastPath.startsWith('/product/')) {
              var slug = lastPath.replace('/product/', '').split('/')[0].split('?')[0];
              var vk = 'nexa_viewed_' + slug;
              if (slug && !sessionStorage.getItem(vk)) {
                sessionStorage.setItem(vk, '1');
                fetch('/api/track/view', {
                  method: 'POST', headers: hdr,
                  body: JSON.stringify({ toolId: slug })
                }).catch(function(){});
              }
            }
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
